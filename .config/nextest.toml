[test-groups]
serial-integration = { max-threads = 1 }

# Run perf unit tests sequentially to avoid race conditions retrieving the JSON
# files from sourcify
[[profile.default.overrides]]
filter = 'package(solidity_testing_perf_cargo)'
test-group = 'serial-integration'

# The solc-comparison suite is a single test covering the whole (version, test)
# matrix, and on a cold cache it first downloads solc's semantic tests for every
# supported version. Minutes are expected there, so don't flag it as slow.
[[profile.default.overrides]]
filter = 'package(solidity_testing_solc_comparison)'
slow-timeout = { period = "10m" }
