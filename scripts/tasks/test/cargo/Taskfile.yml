version: "3"

vars:
  CARGO_CI_FLAGS:
    sh: "scripts/tasks/_utils/rustflags.sh"

  NEXTEST_ARGS: "--workspace --all-features --tests --lib --bins --examples {{.CARGO_CI_FLAGS}} {{.CLI_ARGS}}"

  V2: "package(/^(codegen|language|slang_solidity|solidity)_v2(_|$)/)"
  V1: "package(/^(codegen|language|slang_solidity|solidity|metaslang)(_|$)/) - ({{.V2}})"
  INFRA: "package(/^infra_/)"

tasks:
  "default":
    desc: "Run 'cargo nextest' for all crates, features, and targets."
    deps:
      - "verify-groups"
    cmds:
      - "cargo nextest run {{.NEXTEST_ARGS}} --no-fail-fast"

  "v1":
    desc: "Run 'cargo nextest' for the v1 crates."
    deps:
      - "verify-groups"
    cmds:
      - 'cargo nextest run {{.NEXTEST_ARGS}} --no-fail-fast --filter-expr "{{.V1}}"'

  "v2":
    desc: "Run 'cargo nextest' for the v2 crates."
    deps:
      - "verify-groups"
    cmds:
      - 'cargo nextest run {{.NEXTEST_ARGS}} --no-fail-fast --filter-expr "{{.V2}}"'

  "infra":
    # TODO(infra): this is going away, once the rest of `infra_cli` is depreacted/removed.
    desc: "Run 'cargo nextest' for the build tooling crates."
    deps:
      - "verify-groups"
    cmds:
      - 'cargo nextest run {{.NEXTEST_ARGS}} --no-fail-fast --filter-expr "{{.INFRA}}"'

  "verify-groups":
    desc: "Check that the groups above leave no test unclaimed."
    silent: true
    internal: true
    cmds:
      - |
        ungrouped="$(cargo nextest list \
          {{.NEXTEST_ARGS}} \
          --filter-expr 'not (({{.V1}}) | ({{.V2}}) | ({{.INFRA}}))')"

        if [[ -n "${ungrouped}" ]]; then
          echo >&2 "Found the following tests outside any group:"
          echo >&2 ""
          echo >&2 "${ungrouped}"
          echo >&2 ""
          echo >&2 "Error:"
          echo >&2 "The above tests are in no 'task test:cargo:*' group."
          echo >&2 "Widen the selectors in '{{.TASKFILE}}' to cover them."
          echo >&2 ""
          exit 1
        fi

        echo "OK: every test is in exactly one group."
