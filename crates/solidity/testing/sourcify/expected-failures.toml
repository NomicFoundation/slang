# Failure buckets `run-corpus` tolerates, keyed by check and diagnostic code, narrowed by a
# `message` prefix and/or a `contracts` list where the code alone is too coarse. Every entry
# names the reason and the issue tracking it, or `deliberate = true` where Slang rejects on
# purpose what solc lets through. On the full corpus (`--stale-check`) an entry that matches
# nothing is stale, and an issue-tracked entry claiming 50 contracts or fewer must list them,
# so an entry narrows as its bug gets fixed and leaves with it.

[[failures]]
check = "bind"
code = "resolution/no-matching-callable-declaration"
reason = "An address literal argument does not select the `address` overload (`_safeMint(0xb701…, 1)`)."
issue = "https://github.com/NomicFoundation/slang/issues/2179"

[[failures]]
check = "bind"
code = "resolution/member-not-found"
reason = "An address literal argument does not select the `address` overload of a library or contract member (`Clones.clone(0xeA34…)`, #2179); `type(AbstractContract).interfaceId` is not found (#2180); `C.Error.selector` that solc 0.8.35 rejects too."
issue = "https://github.com/NomicFoundation/slang/issues/2179"

[[failures]]
check = "bind"
code = "resolution/ambiguous-reference"
reason = "`MultiMint.initialize.selector` sees the `initialize` overload MultiMint inherits; solc exposes only its own declarations through the type name."
issue = "https://github.com/NomicFoundation/slang/issues/2149"

[[failures]]
check = "parse"
code = "syntax/incompatible-version-pragma"
reason = "Four-component versions (`pragma solidity 0.8.34.0;`, `^0.8.17.0`): solc's matcher ignores the fourth component, Slang rejects the malformed version on purpose. Every contract in this bucket has one."
deliberate = true

[[failures]]
check = "parse"
code = "syntax/unsupported-abicoder-v1"
reason = "`pragma abicoder v1` selects the legacy ABI coder; Slang supports v2 only, on purpose."
deliberate = true

[[failures]]
check = "parse"
code = "syntax/unsupported-experimental-smt-checker"
reason = "`pragma experimental SMTChecker` asks for a checker Slang does not ship; solc treats it as a no-op without a solver."
deliberate = true

[[failures]]
check = "validate"
code = "structure/duplicate-abicoder-specifier"
reason = "`pragma abicoder v2` followed by `pragma experimental ABIEncoderV2`: solc only rejects the reverse order, Slang rejects any second selection."
deliberate = true

[[failures]]
check = "parse"
code = "syntax/invalid-version-specifier"
reason = "`pragma solidity *0.8.7`: solc's version matcher accepts the stray `*`, Slang rejects the malformed specifier."
deliberate = true

