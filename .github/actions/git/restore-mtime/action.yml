name: "git/restore-mtime"
description: "Restore file mtimes to their last-commit time so cargo fingerprints stay valid after checkout."

runs:
  using: "composite"
  steps:
    # git checkout sets all file mtimes to "now", which invalidates cached cargo fingerprints
    # and causes unnecessary recompilation. This restores mtimes to each file's last commit time,
    # so unchanged files match the cached fingerprints and cargo skips recompilation.
    - name: "Restore file mtimes from git"
      uses: "chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3" # v2.3
      with:
        # Use commit time rather than author time, since we share caches across branches
        args: "--commit-time"

    # The caches are built on the default branch, whose commits usually post-date the PR's.
    # A file the PR changed would therefore get a commit-time mtime OLDER than the cached
    # artifact built from the default branch's version of it.
    # Bump the mtime of every file that differs from the default branch to "now" to force a
    # rebuild. The comparison is against the default branch, not the PR base: a PR stacked on
    # another PR branch inherits that branch's changes, which are not in the cache either.
    #
    # A two-dot diff compares the two trees directly, so a shallow fetch of the default branch
    # is enough. --diff-filter=d drops deletions (nothing on disk to touch); -z/-0 keeps paths
    # with spaces or other special characters intact.
    - name: "Touch files that differ from the default branch"
      if: "${{ github.event_name == 'pull_request' }}"
      shell: "bash"
      env:
        DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
      run: |
        git fetch --depth=1 origin "${DEFAULT_BRANCH}"
        git diff --name-only --diff-filter=d -z "origin/${DEFAULT_BRANCH}" HEAD \
          | xargs -0 --no-run-if-empty touch -c -m --
