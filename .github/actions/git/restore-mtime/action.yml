name: "git/restore-mtime"
description: "Restore file mtimes to their last-commit time so cargo fingerprints stay valid after checkout."

runs:
  using: "composite"
  steps:
    # git checkout sets all file mtimes to "now", which invalidates cached cargo fingerprints
    # and causes unnecessary recompilation. This restores mtimes to each file's last commit time,
    # so unchanged files match the cached fingerprints and cargo skips recompilation.
    - name: "Restore file mtimes from git"
      uses: "chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3" # v2.3
      with:
        # Use commit time rather than author time, since we share caches across branches
        args: "--commit-time"

    # The cache is built from main's tree, whose commits usually post-date the PR's. A file
    # that differs from main therefore gets a commit-time mtime OLDER than the cached artifact
    # built from main's version of it, and cargo would reuse that artifact. Bump every such
    # file to "now" so it rebuilds. This includes changes a stacked PR inherits from its base
    # branch, which are not in the cache either.
    #
    # 'origin/main' exists because the callers check out with fetch-depth 0. The two-dot diff
    # compares the trees directly. --diff-filter=d drops deletions (nothing on disk to touch);
    # -z/-0 keeps paths with spaces or other special characters intact.
    - name: "Touch files that differ from main"
      if: "${{ github.event_name == 'pull_request' }}"
      shell: "bash"
      run: |
        git diff --name-only --diff-filter=d -z origin/main HEAD \
          | xargs -0 --no-run-if-empty touch -c -m --
