name: "common-setup"
description: >
  Shared CI setup: frees disk space, restores file mtimes and (optionally) the
  dependency/cargo-target caches, sets up SFW, and optionally runs 'task setup'
  for the requested tasks. The caller must check out the repository before using
  this action (local actions are only resolvable post-checkout).

inputs:
  task-setup:
    description: >
      Whether to run 'task setup' (true/false). Defaults to "true" (run setup).
    required: false
    default: "true"
  task-setup-args:
    description: >
      Setup tasks to pass to 'task' (e.g. "setup:cargo", "setup:cargo setup:pipenv").
      Empty (the default) runs a bare 'task setup' (all tasks).
    required: false
    default: ""
  sfw-optional:
    description: >
      Passed to setup-sfw's 'optional'. Defaults to "false" (SFW required: a failed
      install fails the job rather than running unprotected). Set "true" for
      best-effort jobs where a socket.dev outage must not fail the run.
    required: false
    default: "false"
  restore-mtime:
    description: 'Whether to restore file mtimes from git ("true"/"false").'
    required: false
    default: "true"
  restore-deps-cache:
    description: 'Whether to restore the dependencies cache ("true"/"false").'
    required: false
    default: "true"
  restore-target-cache:
    description: 'Whether to restore the cargo-target cache ("true"/"false").'
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Validate inputs"
      if: "${{ inputs.task-setup == 'false' && inputs.task-setup-args != '' }}"
      shell: "bash"
      run: |
        echo "Error: 'task-setup-args' is set but 'task-setup' is false — tasks would be ignored."
        exit 1

    - name: "Free up disk space"
      uses: "./.github/actions/free-disk-space"

    - name: "Restore file mtimes from git"
      if: "${{ inputs.restore-mtime == 'true' }}"
      uses: "./.github/actions/git/restore-mtime"

    - name: "Restore Dependencies Cache"
      if: "${{ inputs.restore-deps-cache == 'true' }}"
      uses: "./.github/actions/cache/dependencies/restore"

    - name: "Restore Cargo Target Cache"
      if: "${{ inputs.restore-target-cache == 'true' }}"
      uses: "./.github/actions/cache/cargo-target/restore"

    - name: "Setup SFW"
      uses: "./.github/actions/setup-sfw"
      with:
        optional: "${{ inputs.sfw-optional }}"

    - name: "task ${{ inputs.task-setup-args || 'setup' }}"
      if: "${{ inputs.task-setup == 'true' }}"
      shell: "bash"
      env:
        TASK_SETUP_ARGS: "${{ inputs.task-setup-args }}"
      run: "${SFW_PREFIX:-} ./bin/task ${TASK_SETUP_ARGS:-setup}"
