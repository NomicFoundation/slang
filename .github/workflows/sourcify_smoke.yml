name: "sourcify_smoke"

on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref_name }}"

jobs:
  smoke:
    runs-on: "ubuntu-24.04" # _SLANG_DEV_CONTAINER_BASE_IMAGE_ (keep in sync)

    permissions:
      contents: "read"

    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Full history is needed by 'git/restore-mtime' to find each file's last commit time.

      - name: "Common Setup"
        uses: "./.github/actions/common-setup"
        with:
          infra-setup: "false"
          sfw-optional: "true"

      - name: "Build sourcify binary"
        run: "${SFW_PREFIX:-} ./scripts/bin/with-hermit cargo build --locked --release --bin solidity_testing_sourcify"

      - name: "Run in-repo corpus test cases"
        run: "./scripts/bin/with-hermit ./target/release/solidity_testing_sourcify run-corpus crates/solidity/testing/sourcify/testdata/corpus"

      - name: "Download pinned corpus snapshot"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          lock="crates/solidity/testing/sourcify/corpus.lock"
          field() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" "$lock"; }
          gh release download "$(field tag)" --repo "$(field repo)" --pattern "$(field asset)" --output corpus.tar.xz
          echo "$(field sha256)  corpus.tar.xz" | sha256sum --check
          mkdir -p target/corpus
          tar -xJf corpus.tar.xz -C target/corpus
          rm corpus.tar.xz

      - name: "Run pinned corpus snapshot"
        run: |
          ./scripts/bin/with-hermit ./target/release/solidity_testing_sourcify run-corpus target/corpus \
            --out target/sourcify-results.jsonl --report target/sourcify-report.md
          cat target/sourcify-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload results"
        if: "!cancelled()"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "sourcify-corpus-results"
          path: |
            target/sourcify-results.jsonl
            target/sourcify-report.md
          retention-days: 14
