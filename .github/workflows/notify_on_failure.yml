name: "notify_on_failure"

# zizmor flags 'workflow_run' triggers because they are also triggered by PRs from forks, potentially passing secrets.
# We guard against this explicitly in the job conditions below, so that it only runs on pushes to 'main', and never checks out source code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - "benchmark_cargo_cmp"
      - "benchmark_cargo_slang_v2"
      - "benchmark_cargo_slang"
      - "benchmark_npm"
      - "ci"
      - "publish"
    types:
      - "completed"
    branches:
      - "main"

permissions: {}

jobs:
  notify:
    runs-on: "ubuntu-24.04" # _SLANG_DEV_CONTAINER_BASE_IMAGE_ (keep in sync)
    if: >-
      contains(fromJSON('["failure", "startup_failure", "timed_out"]'), github.event.workflow_run.conclusion)
      && github.repository == 'NomicFoundation/slang'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push'
    steps:
      - name: "Notify workflow failure"
        uses: "slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d" # v4.0.0
        with:
          webhook: "${{ secrets.CI_FAILURES_NOTIFICATIONS_SLACK_WEBHOOK_URL }}"
          webhook-type: "webhook-trigger"
          errors: true
          payload: |
            {
              "workflow_name": "${{ github.event.workflow_run.name }}",
              "branch_name": "${{ github.event.workflow_run.head_branch }}",
              "run_url": "${{ github.event.workflow_run.html_url }}"
            }
