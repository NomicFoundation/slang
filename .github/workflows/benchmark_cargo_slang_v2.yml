name: "benchmark_cargo_slang_v2"

on:
  # Run using manual triggers from GitHub UI:
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Attempt a local run and report results here, without updating the bencher dashboard."
        type: "boolean"
        required: true
        default: true

  # Run on pushes to 'main' branch:
  push:
    branches:
      - "main"

  # Run on every pull request (full benchmark, non-blocking):
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"

permissions: {}

# Queue benchmark workflows for the same branch (main pushes queue for ordered results; PR runs cancel stale ones):
concurrency:
  group: "${{ github.workflow }}-${{ github.ref_name }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  benchmark:
    permissions:
      contents: "read"
      pull-requests: "write"
      checks: "write"

    uses: "./.github/workflows/benchmark_suite.yml"
    with:
      infra-command: "cargo"
      infra-suite: "slang-v2"
      setup-args: "setup:cargo setup:pipenv"
      pr-benchmark: true # Every PR runs the full benchmark.
      pr-benchmark-flag: "--pr-benchmark=full"
      dry-run: "${{ inputs.dryRun == true }}"
    secrets:
      bencher-api-key: "${{ secrets.BENCHER_API_KEY__CARGO_SLANG_V2 }}"
