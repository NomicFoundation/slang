name: "benchmark_cargo_cmp"

on:
  # Run using manual triggers from GitHub UI:
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Attempt a local run and report results here, without updating the bencher dashboard."
        type: "boolean"
        required: true
        default: true

  # Run on pushes to 'main' branch:
  push:
    branches:
      - "main"

  # Run on pull requests (smoke test always, full benchmark with 'ci:perf' label):
  # Only PRs targeting 'main', which includes every PR of a GitHub stack based on 'main' (they trigger as if they
  # targeted the stack's base). A PR based on another branch outside a stack has no base report to compare against.
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "labeled"
    branches:
      - "main"

permissions: {}

# PR runs cancel stale runs of the same PR. Every other run (main pushes, manual triggers) gets a group of its own,
# so main commits are all benchmarked, in parallel. Their reports are dated at the commit time ('infra perf' uses
# 'bencher run --backdate'), so the dashboard stays in commit order whatever order they finish in.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref_name || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  benchmark:
    permissions:
      contents: "read"
      pull-requests: "write"
      checks: "write"

    uses: "./.github/workflows/benchmark_suite.yml"
    with:
      infra-command: "cargo"
      infra-suite: "comparison"
      setup-args: "setup:cargo setup:pipenv"
      pr-benchmark: "${{ contains(github.event.pull_request.labels.*.name, 'ci:perf') || contains(github.event.pull_request.labels.*.name, 'ci:perf:full') }}"
      pr-benchmark-flag: "${{ contains(github.event.pull_request.labels.*.name, 'ci:perf:full') && '--pr-benchmark=full' || '--pr-benchmark' }}"
      dry-run: "${{ inputs.dryRun == true }}"
    secrets:
      bencher-api-key: "${{ secrets.BENCHER_API_KEY__CARGO_CMP }}"
